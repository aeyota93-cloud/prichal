name: prichal

services:
  prichal:
    build: .
    image: prichal:local
    container_name: prichal
    restart: always
    # Only reachable from the server itself, i.e. through an SSH tunnel.
    # Publishing it on another address requires PRICHAL_PASSWORD in .env.
    ports:
      - "127.0.0.1:${PRICHAL_PORT:-9443}:9443"
    env_file: .env # created by install.sh from .env.example
    environment:
      HOST_ROOT: /host
      DATA_DIR: /data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro # read-only: disk usage, hostname, update logs
      - prichal-data:/data # labels, Telegram chat, last update task
    networks: [default, proxy-api]
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

  # Прокси Telegram (telemt) — по желанию: install.sh включает его, если в .env PROXY=1
  # (тогда там же COMPOSE_PROFILES=proxy, и обновление Причала обновляет и прокси).
  proxy:
    profiles: [proxy]
    build: ./proxy
    image: prichal-proxy:local
    container_name: prichal-proxy
    restart: always
    ports:
      - "${PROXY_BIND:-0.0.0.0}:${PROXY_PORT:-443}:8443"
    volumes:
      - ./proxy-data:/data # config.toml (ссылки и секреты), кэш; создаёт install.sh
    # default — выход в интернет к Telegram; proxy-api — только Причал и API прокси.
    # Имя telemt-api есть только в proxy-api: по имени контейнера Причал мог бы попасть
    # на адрес из default, а его API не пускает (whitelist — подсеть proxy-api).
    networks:
      default: {}
      proxy-api:
        aliases: [telemt-api]
    read_only: true
    tmpfs: [/tmp]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

networks:
  # Закрытая сеть управления прокси: API telemt пускает только её адреса и только с
  # паролем PROXY_API_TOKEN (whitelist и auth_header в proxy-data/config.toml).
  proxy-api:
    internal: true
    ipam:
      config:
        - subnet: ${PROXY_API_SUBNET:-172.30.207.0/28}

volumes:
  prichal-data:
