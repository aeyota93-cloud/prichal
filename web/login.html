<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Причал · вход</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">
<main class="login">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 256 256" fill="currentColor" class="ico"><path d="M224,112H200a8,8,0,0,0,0,16h15.64A88.15,88.15,0,0,1,136,207.63V95a32,32,0,1,0-16,0V207.63A88.15,88.15,0,0,1,40.36,128H56a8,8,0,0,0,0-16H32a8,8,0,0,0-8,8,104,104,0,0,0,208,0A8,8,0,0,0,224,112ZM112,64a16,16,0,1,1,16,16A16,16,0,0,1,112,64Z"/></svg>
    </span>
    <p class="brand-name">Причал</p>
  </div>
  <form class="login-form" id="form" novalidate>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <p class="login-error" id="error" role="alert"></p>
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
  <p class="login-hint">Пароль задан в файле <code>.env</code> на сервере (PRICHAL_PASSWORD).</p>
</main>
<script src="login.js"></script>
</body>
</html>
