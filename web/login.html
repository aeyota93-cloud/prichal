<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Причал · вход</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body class="login-page">
<div class="bg" aria-hidden="true"></div>
<main class="login">
  <p class="brand">
    <svg viewBox="0 0 256 256" fill="currentColor" class="ico" aria-hidden="true"><path d="M224,114H200a6,6,0,0,0,0,12h17.8A90.13,90.13,0,0,1,134,209.78V93.4a30,30,0,1,0-12,0V209.78A90.13,90.13,0,0,1,38.2,126H56a6,6,0,0,0,0-12H32a6,6,0,0,0-6,6,102,102,0,0,0,204,0A6,6,0,0,0,224,114ZM110,64a18,18,0,1,1,18,18A18,18,0,0,1,110,64Z"/></svg>
    Причал
  </p>
  <h1>Вход в панель</h1>
  <form class="login-form glass" id="form" novalidate>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <p class="login-error" id="error" role="alert"></p>
    <button class="pbtn white" type="submit">Войти</button>
  </form>
  <p class="login-hint">Пароль задан в файле <code>.env</code> на сервере (PRICHAL_PASSWORD).</p>
</main>
<script src="login.js"></script>
</body>
</html>
